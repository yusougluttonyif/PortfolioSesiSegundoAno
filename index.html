<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {transition: all 0.4s ease;}
        html {scrollbar-width: none; overflow: hidden;}

        body {
            height: 100%;
            display: block;
            justify-content: center;
            align-items: center;
            font-family:'Press Start 2P', serif;
        }
        .firstbackground {
            height: 100%;
            width: 100%;
            background: linear-gradient(180deg, rgb(248, 233, 144), rgb(190, 111, 0));
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .menubuttons {
            outline: 2px solid black;
            corner-shape: scoop;
            cursor: pointer;
            transform-style: preserve-3d;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 20px;
            background-color: black;
            border: 2px solid white;
            border-radius: 10px;
            padding: 10px 20px;
            top: 50%;
            left: 30%;
            position: absolute;
            color: white;
            transform: perspective(100px) translate(-50%, -50%) skewX(10deg) rotateY(10deg);
        }
        .menubuttons:nth-child(2) {
            left: 70%;
            padding: 10px 40px;
            transform: perspective(100px) translate(-50%, -50%) skewX(-10deg) rotateY(-10deg);
        }
        .menubuttons:hover {
            border-color: yellow;
            color: yellow;
            border-radius: 18px;
            transform: perspective(100px) translate(-50%, -50%) skewX(20deg) rotateY(15deg) scale(1.25);
        }
        .menubuttons:hover:nth-child(2) {
            border-color: yellow;
            color: yellow;
            border-radius: 18px;
            transform: perspective(100px) translate(-50%, -50%) skewX(-20deg) rotateY(-15deg) scale(1.25);
        }
        .menubuttons:active {
            transition: all 0.1s ease;
            padding: 20px 30px;
            border-radius: 100px;
        }
        .menubuttons:active:nth-child(2) {
            transition: all 0.1s ease;
            padding: 20px 50px;
            border-radius: 100px;
        }
        .textmenu {
            color: white;
            top: 5%;
            left: 50%;
            position: absolute;
            font-size: 15px;
            transform: translate(-50%, -50%);
            text-shadow: 1.5px 1.5px black, -1.5px -1.5px black, -1.5px 1.5px black, 1.5px -1.5px black;
            white-space: nowrap;
        }
        #pulo {
            transition: all 0.8s ease;
            z-index: 99999;
            display: grid;
            white-space: nowrap;
            transition: all 0.4s ease;
            text-align: center;
            outline: 2px solid black;
            corner-shape: scoop;
            cursor: pointer;
            transform-style: preserve-3d;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 20px;
            background-color: black;
            border: 2px solid white;
            border-radius: 10px;
            padding: 10px 40px;
            top: 90%;
            left: 50%;
            position: absolute;
            color: white;
            transform: translate(-50%, -50%);
        }
        #pulo:hover {
            font-size: 30px;
            padding: 15px 60px;
            color: yellow;
            border-radius: 28px;
            border-color: yellow;
        }
        #pulo:active {
            transition: all 0.1s ease;
            border-radius: 100px;
            font-size: 32px;
            padding: 29px 63px;
        }
        .pulomenu {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.807);
            z-index: 9999999999999999999999;
            opacity: 0;
            display: none;
            transition: opacity 0.3s ease;
        }
        .blackgradient {
            transition: all 0.8s ease;
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgb(61, 16, 0));
            z-index: 9999;
            opacity: 0.8;
            display: grid;
            transform: translateY(1000px);
        }
        .pulochoices, .buttonbase {
            outline: 3px solid black;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            text-align: center;
            align-self: center;
            justify-self: center;
            width: fit-content;
            height: fit-content;
            padding: 10px 30px;
            background-color: black;
            border: 2px solid white;
            border-radius: 10px;
            corner-shape: scoop;
            font-family: 'Press Start 2P', sans-serif;
            color: white;
            font-size: 15px;
        }
        .pulochoices:hover {
            border-color: yellow;
            color: yellow;
            font-size: 18px;
            padding: 15px 41px;
            border-radius: 19px;
        }
        .pulochoices:active {
            transition: all 0.1s ease;
            border-color: red;
            color: red;
            border-radius: 100px;
            padding: 18px 53px;
            font-size: 20px;
        }
        .buttonbase:hover {
            border-color: yellow;
            color: yellow;
            font-size: 18px;
            padding: 15px 41px;
            border-radius: 19px;
        }
        .buttonbase:active {
            transition: all 0.1s ease;
            border-color: yellow;
            color: yellow;
            font-size: 19px;
            padding: 24px 50px;
            border-radius: 100px;
        }
        .closebutton {
            outline: 3px solid black;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            text-align: center;
            top: 10%;
            left: 90%;
            position: absolute;
            transform: translate(-50%, -50%);
            padding: 10px 10px;
            background-color: black;
            border: 2px solid white;
            border-radius: 100px;
            font-family: 'Press Start 2P', sans-serif;
            color: white;
            font-size: 10px;
        }
        .closebutton:hover {
            border-color: yellow;
            color: yellow;
            transform: translate(-50%, -50%) scale(1.3);
        }
        .closebutton:active {
            transition: all 0.1s ease;
            border-color: yellow;
            color: yellow;
            transform: translate(-50%, -50%) scale(1.6);
        }
        .secondbackground {
        transition: all 0.4s ease;
            height: 100%;
            width: 100%;
            background: linear-gradient(180deg, rgb(255, 245, 187), rgb(248, 233, 144));
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(-100%);
        }
    </style>
</head>
<body>

    <!-- segunda parte, sobre mim -->
    <div class="secondbackground" id="secondbackground">
        <button class="buttonbase" onmouseenter="soundhover.play()" onclick="sobremimdeactive()">voltar</button>
    </div>


    <!-- primeira parte, o menu -->
    <div class="firstbackground" id="firstbackground">
      <button id="sobremimbutton" class="menubuttons" onmouseenter="soundhover.play()" onclick="soundclick.play(); sobremimactive()">SOBRE MIM</button>
      <button id="materiasbutton" class="menubuttons" onmouseenter="soundhover.play()" onclick="soundclick.play()">MATÉRIAS</button>
      <p class="textmenu">joaolucas do naascikmento silva</p>
      <div class="blackgradient" id="pulogradient"></div>
      <button id="pulo" onmouseenter="soundhover.play()" onclick="soundclick.play(); openpulo()">PULO RÁPIDO</button>
       <div class="pulomenu" id="pulomenu">
        <p class="textmenu">aqui voce vai pra qualquer lugar do portfolio</p>
        <button class="closebutton" onmouseenter="soundhover.play()" onclick="closepulo()">X</button>
        <button class="pulochoices" onmouseenter="soundhover.play()" onclick="error.play()">matematica malvada</button>
       </div>
    
    
    </div>

    <script>
        const firstbackground = document.getElementById("firstbackground");
        const secondbackground = document.getElementById("secondbackground");
        const pulo = document.getElementById("pulo");
        const pulogradient = document.getElementById("pulogradient");
        const pulomenu = document.getElementById("pulomenu");
        let soundhover = new Audio('https://file.garden/aq_0Fg8cibtOL7XF/undertale-move-selection-sound-effect%20(1).mp3');
        soundhover.volume = 0.5;
        soundhover.loop = false;
        let soundclick = new Audio('https://file.garden/aq_0Fg8cibtOL7XF/undertale-select.mp3');
        soundclick.volume = 0.6;
        soundclick.loop = false;
        let error = new Audio('https://file.garden/aq_0Fg8cibtOL7XF/error-notification%20(1).mp3');
        error.volume = 0.6;
        error.loop = false;
        /* tlvz use isso, sla */
        let closesfx = new Audio('https://file.garden/aq_0Fg8cibtOL7XF/0922.MP3');
        closesfx.volume = 1;
        closesfx.loop = false;
 
         document.onmousemove = mouse;
        function mouse(event) {
             if (event.pageY - 100 < 350) {
              pulo.style.transform = "translate(-50%, -50%) translateY(1200px)"
              pulogradient.style.transform = "translateY(1300px)"
            }
            else {pulo.style.transform = "translate(-50%, -50%)";
                pulogradient.style.transform = "translateY(100px)";
            }
        } 
        function openpulo() {
         pulomenu.style.display = "grid"
         setTimeout(() => {
            pulomenu.style.opacity = "1";
         }, 300);
        }
        function closepulo() {
            soundclick.play();
            pulomenu.style.opacity = "0";
            setTimeout(() => {
                pulomenu.style.display = "none";
            }, 300);
        }
        function sobremimactive() {
            setTimeout(() => {
            firstbackground.style.transform = "translate(-50%, -50%) translateY(100%)";
            secondbackground.style.transform = "translate(-50%, -50%) translateY(0%)";
            firstbackground.style.transition = "all 1s ease";
            secondbackground.style.transition = "all 1s ease";
            }, 100);
        }
        function sobremimdeactive() {
            soundclick.play();
            setTimeout(() => {
            firstbackground.style.transform = "translate(-50%, -50%) translateY(0%)";
            secondbackground.style.transform = "translate(-50%, -50%) translateY(-100%)";
            firstbackground.style.transition = "all 1s ease";
            secondbackground.style.transition = "all 1s ease";
            }, 200);
        }

    </script>
</body>
</html>
